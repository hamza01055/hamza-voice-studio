[project]
name = "hamza-voice-studio-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: runs real model inference; requires installed model weights (skipped otherwise)"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S603", "S607", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "BLE"]
"app/db/migrations/**" = ["E501", "W291", "I", "UP"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
